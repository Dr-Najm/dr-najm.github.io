design:
  theme: classic

  page:
    size: a4
    top_margin: 0.7in
    bottom_margin: 0.7in
    left_margin: 0.7in
    right_margin: 0.7in
    show_footer: true
    show_top_note: false

  colors:
    name: rgb(0, 79, 144)
    headline: rgb(0, 79, 144)
    connections: rgb(50, 50, 50)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)

  typography:
    alignment: justified
    font_family: Source Sans 3
    font_size:
      body: 10pt
      name: 28pt
      headline: 10pt
      section_titles: 1.3em
    bold:
      name: true
      section_titles: true

  header:
    alignment: left
    space_below_name: 0.4cm
    space_below_headline: 0.4cm
    space_below_connections: 0.5cm
    connections:
      show_icons: true
      hyperlink: true

  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.3cm

  sections:
    show_time_spans_in:
      - Experience

  templates:
    footer: '*Ahmad Najmuddin Ibrahim -- PAGE_NUMBER/TOTAL_PAGES*'
